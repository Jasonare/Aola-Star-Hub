  <g class="frame f1"><image href="magic-sword-soul_1_2_f1.png" x="54" y="0" width="916" height="1024" preserveAspectRatio="xMidYMid meet"/></g>
  <g class="frame f2"><image href="magic-sword-soul_1_2_f2.png" x="54" y="0" width="916" height="1024" preserveAspectRatio="xMidYMid meet"/></g>
</svg>
