<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <desc>Magic Sword Soul front idle; 3 pose frames; 120ms per frame.</desc>
  <style><![CDATA[.frame{opacity:0;animation:idle 360ms step-end infinite}.f0{animation-delay:0ms}.f1{animation-delay:-120ms}.f2{animation-delay:-240ms}@keyframes idle{0%,33.32%{opacity:1}33.33%,100%{opacity:0}}]]></style>
  <g class="frame f0"><image href="magic-sword-soul_1_1.png" x="70" y="0" width="884" height="1024" preserveAspectRatio="xMidYMid meet"/></g>
  <g class="frame f1"><image href="magic-sword-soul_1_1_f1.png" x="70" y="0" width="884" height="1024" preserveAspectRatio="xMidYMid meet"/></g>
  <g class="frame f2"><image href="magic-sword-soul_1_1_f2.png" x="70" y="0" width="884" height="1024" preserveAspectRatio="xMidYMid meet"/></g>
</svg>
