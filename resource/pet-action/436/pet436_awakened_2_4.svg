<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <desc>Magic Sword Soul reverse attack; mirrored wind-up, slash, recovery; 3 pose frames; 90ms per frame.</desc>
  <style><![CDATA[.frame{opacity:0;animation:attack 270ms step-end infinite}.f0{animation-delay:0ms}.f1{animation-delay:-90ms}.f2{animation-delay:-180ms}@keyframes attack{0%,33.32%{opacity:1}33.33%,100%{opacity:0}}]]></style>
  <g transform="translate(1280 0) scale(-1 1)"><g class="frame f0"><image href="magic-sword-soul_1_4_f1.png" x="90" y="-100" width="1100" height="920" preserveAspectRatio="xMidYMid meet"/></g><g class="frame f1"><image href="magic-sword-soul_1_4.png" x="90" y="-100" width="1100" height="920" preserveAspectRatio="xMidYMid meet"/></g><g class="frame f2"><image href="magic-sword-soul_1_4_f2.png" x="90" y="-100" width="1100" height="920" preserveAspectRatio="xMidYMid meet"/></g></g>
</svg>
